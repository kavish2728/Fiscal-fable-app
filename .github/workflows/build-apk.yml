
name: Build Fiscal Fable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -q Fiscal-Fable-APK-Build-Ready.zip -d project

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts \
            -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Fiscal Fable APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" -type f -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fiscal-Fable-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
