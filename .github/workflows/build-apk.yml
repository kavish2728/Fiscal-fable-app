
name: Build Fiscal Fable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q Fiscal-Fable-APK-Build-Ready.zip -d project

      - name: Verify project
        run: |
          ls -la project/fiscal-fable-build
          test -f project/fiscal-fable-build/gradlew

      - name: Build APK
        run: |
          cd project/fiscal-fable-build
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fiscal-Fable-APK
          path: project/fiscal-fable-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
